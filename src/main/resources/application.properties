spring.application.name=DeliveryService

# ─── PostgreSQL Database ────────────────────────────────────────────────────────
# Use environment variables in production. Fallback to local dev values.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/delivery_service}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:akhilesh}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── Connection Pool (HikariCP) ────────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# ─── Hibernate / JPA ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ─── Server ────────────────────────────────────────────────────────────────────
server.port=${PORT:8081}

# ─── JWT ───────────────────────────────────────────────────────────────────────
# Set JWT_SECRET environment variable in production (min 32 characters)
# jwt.secret is read by JWTUtil via System.getenv("JWT_SECRET")

# ─── Mail (SMTP) ───────────────────────────────────────────────────────────────
# Use environment variables in production
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:narimallaakhilesh02@gmail.com}
spring.mail.password=${MAIL_PASSWORD:nisb jtkc uuug lhyh}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# ─── Logging ───────────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.KeyStone.DeliveryService=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ─── Actuator (production hardening) ──────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized